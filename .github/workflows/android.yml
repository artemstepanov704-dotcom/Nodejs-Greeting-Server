name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || true
          npx @capacitor/core@latest || true
          npx @capacitor/cli@latest || true

      - name: Initialize & Sync Capacitor Android
        run: |
          mkdir -p www
          npx cap init TruckerTalk com.trucker.talk --web-dir www || true
          npx cap add android || true
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TruckerTalk-App
          path: "**/build/outputs/apk/debug/app-debug.apk"
          
